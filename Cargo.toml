[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/keiaa-75/lintgraph"

[workspace.dependencies]
lintgraph-core = { path = "crates/lintgraph-core", version = "0.1.0" }
lintgraph-config = { path = "crates/lintgraph-config", version = "0.1.0" }
lintgraph-rules = { path = "crates/lintgraph-rules", version = "0.1.0" }
lintgraph-python-pack = { path = "crates/lintgraph-python-pack", version = "0.1.0" }
lintgraph-report = { path = "crates/lintgraph-report", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1